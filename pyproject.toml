[project]
name = "mlops-pipeline"
version = "0.1.0"
description = "Versioned training, a served credit-default model, drift monitoring, and an incident responder whose cause ranking is scored on injected faults."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evidently==0.7.23",
    "fastapi==0.143.0",
    "lightgbm==4.7.0",
    "mlflow==3.17.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
mlops-pipeline = "mlops_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep this path and the [project.scripts] target above in step when renaming the package.
[tool.hatch.build.targets.wheel]
packages = ["src/mlops_pipeline"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
pipeline = [
    "dvc==3.67.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
